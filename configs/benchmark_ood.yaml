# benchmark_ood.yaml — OOD 外推基准评测配置
# 与 code/benchmark_ood.py 的 DEFAULT_CONFIG 结构一致；这里仅覆盖需要显式声明的项。

data:
  path: null                      # 真实数据 .npz/.csv 路径（相对项目根）；null=用内置合成数据
  synthetic:
    n_train: 2400
    n_test: 900
    seed: 7
    noise_std: 0.15

model:
  checkpoint: null                # 真实多尺度虚拟孪生检查点；null=使用 VirtualTwin 结构化模型
  hidden: [32, 32]                # 虚拟孪生·细胞尺度 MLP 隐藏层
  n_ensemble: 5                   # 集成规模（epistemic 不确定度）
  novelty_k: 1.5                  # 新颖度(OOD)不确定度权重
  random_state: 0

baselines:
  knn_k: 5

eval:
  bootstrap_samples: 200
  ci_alpha: 0.95
  calibration_levels: [0.5, 0.8, 0.9, 0.95]
  memorization_flag_delta: 0.0    # 模型相对最佳简单基线的 OOD RMSE 提升阈值

output:
  dir: experiments
  prefix: benchmark
