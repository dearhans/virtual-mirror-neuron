# benchmark_ood_compositional_nc.yaml — 组合性先验 + 「无」共形校准（对照：看校准改善量）
# 与 benchmark_ood_compositional.yaml 完全一致，仅 conformal=false。

data:
  path: null
  synthetic:
    n_train: 2400
    n_test: 900
    seed: 7
    noise_std: 0.15
    compositional: true
    mag_train: 0.6
    mag_ood: 1.4

model:
  checkpoint: null
  hidden: [32, 32]
  n_ensemble: 5
  novelty_k: 1.5
  random_state: 0
  compositional: true
  curriculum: true
  conformal: false             # 关闭共形，仅用孪生自带不确定度（对照）

baselines:
  knn_k: 5

eval:
  bootstrap_samples: 200
  ci_alpha: 0.95
  calibration_levels: [0.5, 0.8, 0.9, 0.95]
  memorization_flag_delta: 0.0
  should_generalize:
    ood_agent: true
    ood_neuro: true
    ood_action: true
  subset_labels:
    id: "ID"
    ood_agent: "OOD-未见主体"
    ood_action: "OOD-组合双扰动"
    ood_neuro: "OOD-新调质"

output:
  dir: experiments
  prefix: benchmark_comp_nc
